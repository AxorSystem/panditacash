name: PanditaCash
options:
  bundleIdPrefix: com.axorsystem
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es-MX

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: K8U8NUWJ4C
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "21"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PanditaCash:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PanditaCash
        excludes:
          - "**/.DS_Store"
    resources:
      - path: PanditaCash/Assets.xcassets
    info:
      path: PanditaCash/Info.plist
      properties:
        CFBundleDisplayName: PanditaCash
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            axorcloud.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
              NSExceptionMinimumTLSVersion: TLSv1.2
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
        NSCameraUsageDescription: "PanditaCash necesita tu cámara para tomar fotos de tu INE y verificar tu identidad."
        NSPhotoLibraryUsageDescription: "PanditaCash necesita acceso a tus fotos para adjuntar documentos de identidad."
        NSContactsUsageDescription: "PanditaCash usa contactos para sugerir tu aval de referencia."
        NSCalendarsWriteOnlyAccessUsageDescription: "PanditaCash agrega tus pagos programados al Calendario para recordatorios."
        NSUserNotificationsUsageDescription: "PanditaCash te avisa cuando un pago vence pronto para que no se te olvide."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.axorsystem.panditacash
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  PanditaCashUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PanditaCashUITests
    dependencies:
      - target: PanditaCash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.axorsystem.panditacash.uitests
        TEST_TARGET_NAME: PanditaCash
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  PanditaCash:
    build:
      targets:
        PanditaCash: all
        PanditaCashUITests: [test]
    test:
      targets:
        - PanditaCashUITests
      commandLineArguments:
        "-uitest": true
